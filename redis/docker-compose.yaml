services:
  redis:
    image: redis:6.0.7
    container_name: redis
    restart: always
    volumes:
      - redis_volume_data:/data
    ports:
      - 6379:6379

  redis_insight:
    image: redislabs/redisinsight:1.14.0
    container_name: redis_insight
    restart: always
    ports:
      - 8001:8001
    volumes:
      - redis_insight_volume_data:/db
  
  redis_load_generator:
    build:
      context: ./redis-load-generator
      dockerfile: Dockerfile
    container_name: redis_load_generator
    restart: always
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOAD_INTERVAL=0.1
      - MAX_KEYS=10000
      - BATCH_SIZE=100

volumes:
  redis_volume_data:
  redis_insight_volume_data:
