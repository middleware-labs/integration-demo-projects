# Spring Boot Application Configuration for Docker JSON Log Reproduction

# Application info
spring.application.name=json-log-reproduction-service
server.port=8080

# Actuator endpoints (for health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging configuration
logging.config=classpath:log4j2.xml

# Prevent Spring Boot from adding additional console appenders
logging.register-shutdown-hook=false

# Application info
info.app.name=Docker JSON Log Reproduction
info.app.description=Reproduces Docker json-file logging driver format
info.app.version=1.0.0

# Thread pool configuration (to simulate the user's vertx setup)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10 