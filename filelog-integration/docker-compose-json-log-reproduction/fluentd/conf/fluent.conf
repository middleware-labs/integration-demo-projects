<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match json-log-app>
  @type file
  path /fluentd/log/app
  append true
  <format>
    @type json
  </format>
  <buffer>
    timekey 1d
    timekey_use_utc true
    timekey_wait 10m
  </buffer>
</match>

<match *>
  @type stdout
</match>
